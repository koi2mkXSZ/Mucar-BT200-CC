name: DollarFix RE static tools

on:
  push:
    paths:
      - 'reverse/dollarfix/tools/**'
      - 'reverse/dollarfix/tests/**'
      - '.github/workflows/dollarfix-static.yml'
  pull_request:
    paths:
      - 'reverse/dollarfix/tools/**'
      - 'reverse/dollarfix/tests/**'
      - '.github/workflows/dollarfix-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile static RE scripts
        run: python -m compileall -q reverse/dollarfix/tools reverse/dollarfix/tests
      - name: Test offline fixtures
        run: python -m unittest discover -s reverse/dollarfix/tests -p 'test_*.py' -v
